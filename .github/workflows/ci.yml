# main руу push хийх болон PR бүрт сайтыг build хийж шалгана.
# Deploy-г Cloudflare Pages өөрөө хийнэ: main руу push → https://kinotube.pages.dev
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
